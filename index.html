<body>

  <!-- Overlay успішного входу - кольорова шторка та папка -->
  <div id="success-overlay" class="success-overlay">
    <div class="wipe">
      <span class="wipe-stripe"></span><span class="wipe-stripe"></span><span class="wipe-stripe"></span>
      <span class="wipe-stripe"></span><span class="wipe-stripe"></span><span class="wipe-stripe"></span>
    </div>
    <div class="success-card">
      <span class="success-icon">📂</span>
    </div>
  </div>

  <!-- Модальне вікно для введення коду -->
  <div id="code-modal" class="modal-overlay">
    <div class="modal-content">
      <h2 id="modal-title">Введіть код доступу</h2>
      <input type="text" id="code-input" placeholder="Код" autocomplete="off">
      <p id="code-error" class="code-error"></p>
      <div class="modal-buttons">
        <button id="code-submit" class="modal-btn submit">Увійти</button>
        <button id="code-cancel" class="modal-btn cancel">Скасувати</button>
      </div>
    </div>
  </div>

  <style>
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(43, 35, 80, 0.55);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }
    .modal-overlay.active {
      display: flex;
    }
    .modal-content {
      background: var(--paper);
      border: var(--border) solid var(--ink);
      border-radius: 24px;
      box-shadow: 0 8px 0 var(--ink);
      padding: 32px;
      text-align: center;
      max-width: 340px;
      width: 90%;
      animation: modalAppear 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes modalAppear {
      from { transform: scale(0.8) rotate(-2deg); opacity: 0; }
      to { transform: scale(1) rotate(0); opacity: 1; }
    }
    .modal-content h2 {
      font-family: var(--font-head);
      color: var(--ink);
      font-size: 1.5rem;
      margin-bottom: 20px;
    }
    #code-input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1.5rem;
      font-family: var(--font-head);
      font-weight: 700;
      letter-spacing: 2px;
      border: var(--border) solid var(--ink);
      border-radius: 14px;
      background: #f6f4ff;
      color: var(--ink);
      text-align: center;
      outline: none;
      transition: background 0.2s, box-shadow 0.2s;
    }
    #code-input:focus {
      background: #fff;
      box-shadow: 0 0 0 4px rgba(155, 93, 229, 0.35);
    }
    #code-input::placeholder {
      color: rgba(43, 35, 80, 0.35);
      letter-spacing: 0;
      font-weight: 400;
    }
    .code-error {
      color: #e11d48;
      font-weight: 700;
      font-size: 0.95rem;
      min-height: 24px;
      margin: 12px 0;
    }
    .modal-buttons {
      display: flex;
      gap: 12px;
    }
    .modal-btn {
      flex: 1;
      padding: 12px 20px;
      font-family: var(--font-head);
      font-size: 1.05rem;
      font-weight: 700;
      border: var(--border) solid var(--ink);
      border-radius: 14px;
      box-shadow: 0 5px 0 var(--ink);
      cursor: pointer;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    .modal-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 var(--ink);
    }
    .modal-btn:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 var(--ink);
    }
    .modal-btn:disabled {
      cursor: wait;
      transform: none;
    }
    .modal-btn.submit {
      background: linear-gradient(90deg, var(--grape), var(--bubblegum));
      color: white;
      text-shadow: 0 2px 0 rgba(0, 0, 0, 0.2);
    }
    .modal-btn.cancel {
      background: var(--paper);
      color: var(--ink);
    }

    /* Loading dots animation */
    .loading-dots {
      display: inline-flex;
      gap: 4px;
    }
    .loading-dots span {
      width: 8px;
      height: 8px;
      background: white;
      border-radius: 50%;
      animation: dotPulse 1s ease-in-out infinite;
    }
    .loading-dots span:nth-child(2) { animation-delay: 0.15s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes dotPulse {
      0%, 100% { transform: scale(0.6); opacity: 0.4; }
      50% { transform: scale(1); opacity: 1; }
    }

    /* Success overlay: colored curtain wipe + folder card */
    .success-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      justify-content: center;
      align-items: center;
      z-index: 1001;
      overflow: hidden;
    }
    .success-overlay.active {
      display: flex;
    }

    /* Six vertical stripes slide up one after another and cover the screen */
    .wipe {
      position: absolute;
      inset: 0;
      display: flex;
    }
    .wipe-stripe {
      flex: 1;
      height: 100%;
      transform: translateY(100%);
      animation: wipeUp 0.4s cubic-bezier(0.7, 0, 0.2, 1) both;
    }
    .wipe-stripe:nth-child(1) { background: var(--coral);     animation-delay: 0s; }
    .wipe-stripe:nth-child(2) { background: var(--sunflower); animation-delay: 0.05s; }
    .wipe-stripe:nth-child(3) { background: var(--mint);      animation-delay: 0.1s; }
    .wipe-stripe:nth-child(4) { background: var(--sky);       animation-delay: 0.15s; }
    .wipe-stripe:nth-child(5) { background: var(--grape);     animation-delay: 0.2s; }
    .wipe-stripe:nth-child(6) { background: var(--bubblegum); animation-delay: 0.25s; }
    @keyframes wipeUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    /* Folder card pops in once the curtain is almost closed */
    .success-card {
      position: relative;
      width: 170px;
      height: 170px;
      border-radius: 32px;
      background: var(--paper);
      border: 4px solid var(--ink);
      box-shadow: 0 10px 0 var(--ink);
      display: flex;
      justify-content: center;
      align-items: center;
      animation: cardPop 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s both;
    }
    .success-icon {
      font-size: 96px;
      line-height: 1;
      display: block;
      animation: folderOpen 0.5s ease-out 0.45s both;
    }
    @keyframes cardPop {
      from { transform: scale(0) rotate(-12deg); opacity: 0; }
      to { transform: scale(1) rotate(0deg); opacity: 1; }
    }
    @keyframes folderOpen {
      0% { transform: translateY(0) scale(0.9); }
      50% { transform: translateY(-10px) scale(1.12); }
      100% { transform: translateY(0) scale(1); }
    }
  </style>

  <script>
    // Таблиця з кодами (доступ "усі, хто має посилання"), колонки: Клас | Код
    // https://docs.google.com/spreadsheets/d/1pF5NQbIy92UI_4gsGXKDy6Q2jF1u7FWG2WAxmIqBHrQ/edit
    const SHEET_ID = '1pF5NQbIy92UI_4gsGXKDy6Q2jF1u7FWG2WAxmIqBHrQ';
    const SHEET_GID = '0';
    // Дані беремо через Google Visualization API у форматі JSONP (тег <script>),
    // бо звичайний fetch блокується CORS, коли сторінку відкрито як локальний файл.
    const CODES_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?gid=${SHEET_GID}&tqx=out:json;responseHandler:onCodesLoaded`;

    let currentLink = null;
    let currentClass = null;

    // Завантаження таблиці кодів: повертає Map "Клас" -> "Код"
    function loadCodes() {
      return new Promise((resolve, reject) => {
        const script = document.createElement('script');
        const timer = setTimeout(() => finish(new Error('Таймаут завантаження кодів')), 10000);

        function finish(error, codes) {
          clearTimeout(timer);
          delete window.onCodesLoaded;
          script.remove();
          error ? reject(error) : resolve(codes);
        }

        window.onCodesLoaded = (data) => {
          try {
            const codes = new Map();
            for (const row of data.table.rows) {
              const nameCell = row.c[0];
              const codeCell = row.c[1];
              if (!nameCell || nameCell.v == null || !codeCell || codeCell.v == null) continue;
              // f — відформатоване значення (зберігає нулі на початку), v — сире
              const code = codeCell.f != null ? codeCell.f : String(codeCell.v);
              codes.set(String(nameCell.v).trim(), code.trim());
            }
            finish(null, codes);
          } catch (e) {
            finish(e);
          }
        };

        script.onerror = () => finish(new Error('Не вдалося завантажити таблицю кодів'));
        script.src = CODES_URL + '&_t=' + Date.now();
        document.head.appendChild(script);
      });
    }

    // Завантаження коду для конкретного класу
    async function fetchCodeForClass(className) {
      try {
        const codes = await loadCodes();
        return codes.get(className) || null;
      } catch (error) {
        console.error('Помилка завантаження кодів:', error);
        return null;
      }
    }

    // DOM елементи
    const modal = document.getElementById('code-modal');
    const modalTitle = document.getElementById('modal-title');
    const codeInput = document.getElementById('code-input');
    const codeError = document.getElementById('code-error');
    const submitBtn = document.getElementById('code-submit');
    const cancelBtn = document.getElementById('code-cancel');

    // Відкрити модальне вікно
    function openModal(className, link) {
      currentClass = className;
      currentLink = link;
      modalTitle.textContent = `Код для ${className}`;
      codeInput.value = '';
      codeError.textContent = '';
      modal.classList.add('active');
      codeInput.focus();
    }

    // Закрити модальне вікно
    function closeModal() {
      modal.classList.remove('active');
      currentLink = null;
      currentClass = null;
    }

    // Показати успіх і редірект
    const successOverlay = document.getElementById('success-overlay');

    function showSuccessAndRedirect(link) {
      modal.classList.remove('active');
      successOverlay.classList.add('active');

      setTimeout(() => {
        window.location.href = link;
      }, 800);
    }

    // Перевірити код
    async function checkCode() {
      const enteredCode = codeInput.value.trim();

      // Блокуємо кнопку під час перевірки
      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span class="loading-dots"><span></span><span></span><span></span></span>';
      codeError.textContent = '';

      const correctCode = await fetchCodeForClass(currentClass);

      submitBtn.disabled = false;
      submitBtn.innerHTML = 'Увійти';

      if (!correctCode) {
        codeError.textContent = 'Помилка: код не знайдено';
        return;
      }

      if (enteredCode === correctCode) {
        showSuccessAndRedirect(currentLink);
      } else {
        codeError.textContent = 'Невірний код';
        codeInput.select();
      }
    }

    // Обробники подій
    document.querySelectorAll('.class-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const className = btn.dataset.class;
        const link = btn.href;
        openModal(className, link);
      });
    });

    submitBtn.addEventListener('click', checkCode);
    cancelBtn.addEventListener('click', closeModal);

    codeInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') checkCode();
      if (e.key === 'Escape') closeModal();
    });

    modal.addEventListener('click', (e) => {
      if (e.target === modal) closeModal();
    });

    // Скинути стан при поверненні на сторінку (кнопка "назад")
    window.addEventListener('pageshow', () => {
      successOverlay.classList.remove('active');
      modal.classList.remove('active');
    });

    // Для мобільних - скинути при поверненні фокусу на сторінку
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        successOverlay.classList.remove('active');
        modal.classList.remove('active');
      }
    });
  </script>
  <script src="background.js"></script>
</body>
